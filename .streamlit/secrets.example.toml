# Streamlit Secrets Template
#
# INSTRUCTIONS:
# 1. Copy this file to secrets.toml: cp secrets.example.toml secrets.toml
# 2. Fill in your actual API keys and credentials
# 3. NEVER commit secrets.toml to git (it's in .gitignore)
# 4. For Streamlit Cloud, paste these secrets in app settings

# ============================================================================
# Google Gemini API (Primary LLM Provider)
# ============================================================================
# Get your key from: https://makersuite.google.com/app/apikey
GOOGLE_API_KEY = "paste-your-google-api-key-here"
GEMINI_MODEL = "gemini-1.5-flash"
GEMINI_TEMPERATURE = 0

# ============================================================================
# Snowflake Cortex AI (Fallback LLM Provider)
# ============================================================================
# Get these from your Snowflake admin
SNOWFLAKE_ACCOUNT = "xy12345.region.cloud"
SNOWFLAKE_USER = "your_service_user"
SNOWFLAKE_WAREHOUSE = "COMPUTE_WH"
SNOWFLAKE_DATABASE = "CAPSTONE_DB"
SNOWFLAKE_SCHEMA = "PREDICTIVE_MAINTENANCE"

# Snowflake Authentication: Choose ONE method below
# Option 1: Key-pair authentication (recommended)
SNOWFLAKE_PRIVATE_KEY = """
-----BEGIN PRIVATE KEY-----
your_private_key_here
-----END PRIVATE KEY-----
"""

# Option 2: Password authentication (uncomment if using password)
# SNOWFLAKE_PASSWORD = "your_snowflake_password"

# ============================================================================
# LangSmith Tracing
# ============================================================================
# Get API key from: https://smith.langchain.com → Settings → API Keys
LANGSMITH_TRACING = true
LANGSMITH_PROJECT = "Demo"
LANGSMITH_API_KEY = "lsv2_pt_your_api_key_here"

# APAC region (Asia-Pacific)
LANGSMITH_ENDPOINT = "https://apac.api.smith.langchain.com"
# US region (default)
# LANGSMITH_ENDPOINT = "https://api.smith.langchain.com"

# ============================================================================
# LLM Provider Strategy (Optional)
# ============================================================================
# Options: auto (use both with fallback), gemini (only), snowflake (only)
LLM_PRIMARY = "auto"
LLM_FALLBACK = "auto"
LLM_MAX_RETRIES = 2

# ============================================================================
# AWS S3 (Optional - for report storage)
# ============================================================================
# AWS_ACCESS_KEY_ID = "your-access-key"
# AWS_SECRET_ACCESS_KEY = "your-secret-key"
# AWS_DEFAULT_REGION = "us-east-1"
# S3_BUCKET_NAME = "your-bucket-name"

# ============================================================================
# Notes
# ============================================================================
# - Streamlit automatically loads secrets from this file in development
# - On Streamlit Cloud, add secrets via Settings → Secrets
# - Keep sensitive data (API keys, passwords) out of code
# - Always use secrets.toml for sensitive configuration
